[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/najammelha run build"
  publish = "artifacts/najammelha/dist/public"
  functions = "netlify/functions"

# vite.config.ts requires these (they come from Replit's workflow elsewhere).
[build.environment]
  PORT = "3000"
  BASE_PATH = "/"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
